<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlink — Demo Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<main>
<header>
    <div class="eyebrow">UNLINK · LIVE DEMO DASHBOARD</div>
    <h1>Same browsing. Less identity accumulation.</h1>
    <p>Run real navigations through the extension and compare a normal persistent identity with Unlink's actual container decisions.</p>
  </header>

<section class="panel">
    <div class="section-title">RUN THE DEMO</div>
    <div class="trace">
      <button data-key="gmail">1 · Gmail</button>
      <span>→</span>
      <button data-key="drive">2 · Drive</button>
      <span>→</span>
      <button data-key="search">3 · Google Search</button>
      <span>→</span>
      <button data-key="wiki">4 · Wikipedia</button>
      <span>→</span>
      <button data-key="reddit">5 · Reddit</button>
      <span>→</span>
      <button data-key="bbc">6 · BBC</button>
    </div>
    <div class="toolbar">
    </div>
  </section>
</main>
<script src="dashboard.js"></script>
</body>
</html>
